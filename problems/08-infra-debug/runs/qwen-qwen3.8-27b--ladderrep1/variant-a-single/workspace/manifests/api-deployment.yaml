apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: staging # ASSUMPTION: namespace not specified in the ticket
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.internal/staging/api:1.4.2 # ASSUMPTION: image/tag not given in the ticket
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
